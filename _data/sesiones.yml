# =============================================================================
# Calendario de la Escuela de Invierno 2027
# =============================================================================
# ESTE FICHERO ES LA ÚNICA FUENTE DEL CALENDARIO. La portada, el programa, las
# páginas de cada sesión y la tira de navegación entre sesiones se generan de
# aquí. Si cambia una fecha o un ponente, se cambia aquí y en ningún otro sitio.
#
# Campos:
#   num      número de sesión (1–7), usado por pages/sesionN.md
#   fecha        texto completo, p.ej. "Martes 9 de marzo"
#   fecha_corta  etiqueta corta en español para la tira de sesiones ("9 mar").
#                Se escribe a mano a propósito: el filtro `date` de Jekyll usa
#                la configuración regional del sistema y devolvería "9 Mar".
#   iso      fecha en formato AAAA-MM-DD (para ordenar y para el calendario)
#   ponente  nombre tal y como aparece en _data/profesorado.yml
#   tema     título de la sesión
#   web      página del ponente (opcional)
#   foto     fichero en assets/img/profesorado/ (opcional)
#
# Todas las sesiones son de 15:00 a 18:30 (CET). El horario detallado dentro de
# la sesión está en _layouts/sesion.html, que es común a las siete.
#
# NOTA: no hay sesiones el 23 ni el 25 de marzo porque es Semana Santa
# (Domingo de Pascua: 28 de marzo de 2027).
# -----------------------------------------------------------------------------

