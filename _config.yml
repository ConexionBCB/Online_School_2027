# =============================================================================
# Escuela Online en Bioinformática Avanzada 2027
# =============================================================================
# EDITA ESTE FICHERO PRIMERO. Los valores del bloque `curso:` se usan en varias
# páginas a la vez (inicio, programa, logística, pie de página), así que
# cambiándolos aquí se actualiza todo el sitio.
#
# EL CALENDARIO NO ESTÁ AQUÍ: está en `_data/sesiones.yml` (fechas, ponentes y
# temas de las siete sesiones). Ese fichero es su única fuente.
#
# Todo lo marcado como "[TBC]" está pendiente de confirmar. Para localizarlo:
#     grep -rn "TBC" --exclude-dir=.git .
# =============================================================================

title: "Escuela Online en Bioinformática Avanzada 2027"
description: "Curso avanzado de bioinformática 100 % en línea sobre métodos modernos de análisis de datos, pensado para profesionales y estudiantes que quieren actualizarse y, en particular, para docentes que deseen renovar sus asignaturas."

# IMPORTANTE: `baseurl` debe coincidir con el nombre del repositorio en GitHub.
baseurl: "/Online_School_2027"
# PROVISIONAL: mientras el repositorio esté en la cuenta IAndreu.
# Al transferirlo a ConexionBCB, cambiar por "https://conexionbcb.github.io".
url: "https://iandreu.github.io"

# -----------------------------------------------------------------------------
# Datos del curso
# -----------------------------------------------------------------------------
curso:
  # URL del repositorio en GitHub. Se usa para enlazar las carpetas de
  # materiales y la guía del profesorado.
  # ¡Actualízala si mueves el repositorio a otra cuenta u organización!
  # PROVISIONAL: al transferir el repositorio a ConexionBCB, cambiar
  # "IAndreu" por "ConexionBCB" en esta línea. De aquí salen los enlaces
  # a las carpetas de materiales y a la guía del profesorado.
  repo_url: "https://github.com/IAndreu/Online_School_2027"

  # Formato -------------------------------------------------------------------
  modalidad: "100 % en línea"
  plazas: "30"
  # Zona horaria de referencia de los horarios publicados. Imprescindible
  # indicarla: puede haber participantes en husos distintos.
  zona_horaria: "CET (hora peninsular española)"

  # Horario de las sesiones ---------------------------------------------------
  # Las siete sesiones son en martes y jueves, todas con el mismo horario.
  horario_corto: "martes y jueves, de 15:00 a 18:30"
  hora_inicio: "15:00"
  hora_fin: "18:30"

  # Fechas (resumen; el calendario completo está en _data/sesiones.yml) -------
  fechas_corto: "9 de marzo – 6 de abril de 2027"
  fechas_largo: "del 9 de marzo al 6 de abril de 2027, en siete sesiones"

  # Matrícula -----------------------------------------------------------------
  # Al ser en línea no hay alojamiento ni manutención, así que el precio de la
  # edición de verano (500 €) no sirve de referencia.
  precio: "200 €"
  # Descuento para socias/os de la SEBiBC. En la edición de verano fue de 25 €.
  # Mientras estos dos campos estén en "[TBC]", la frase del descuento NO se
  # muestra en la web: así no se publica una cifra sin confirmar.
  # Para activarla, rellena LOS DOS.
  precio_socios: "[TBC]"                     # p.ej. "175 €"
  descuento_socios: "[TBC]"                  # p.ej. "25 €"

  # Plazos --------------------------------------------------------------------
  # Fecha de cierre del plazo (oficial).
  preinscripcion_cierre: "15 de diciembre de 2026"
  # Formulario de preinscripción, ya activo y aceptando respuestas.
  preinscripcion_url: "https://docs.google.com/forms/d/e/1FAIpQLSdLFWihvO22MZl9HiiC7UuI1bxewIEg-_3_UCoHmnf1vG8u7g/viewform"

  # Aula del curso: Google Classroom --------------------------------------------
  # Deja vacío hasta que la clase esté creada. Mientras esté vacío, la página
  # "Classroom" muestra un aviso de "próximamente" en lugar del botón.
  # El acceso es por invitación: el código de la clase NO se publica en la web.
  classroom_url: ""

  # Videoconferencia: Google Meet ---------------------------------------------
  # Las clases se imparten con el enlace de Meet propio de la clase, al que se
  # entra desde Classroom. El enlace no se publica en la web.
  videoconferencia: "Google Meet"
  # ¿Se graban las sesiones? Afecta al consentimiento que hay que pedir en la
  # preinscripción. Valores: "sí", "no", "[TBC]"
  grabaciones: "no"

  # Contacto ------------------------------------------------------------------
  email: "conexion-bcb@csic.es"

# -----------------------------------------------------------------------------
# Navegación (etiqueta, ruta relativa a baseurl)
# Las siete sesiones NO van aquí: se generan desde _data/sesiones.yml y
# aparecen como una tira de fechas en el programa y en cada sesión.
# -----------------------------------------------------------------------------
nav:
  - label: Inicio
    path: /
  - label: Programa
    path: /schedule/
  - label: Classroom
    path: /classroom/
  - label: Organización
    path: /organizacion/
  - label: Logística
    path: /logistics/

# Build
markdown: kramdown
highlighter: rouge

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - CONTRIBUTING.md
  - scripts/
  - vendor/
